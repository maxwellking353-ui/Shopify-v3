services:
  - type: web
    name: main-api
    env: python
    plan: free
    buildCommand: "pip install fastapi uvicorn aiohttp phonenumbers faker"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 8 --limit-concurrency 200"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
